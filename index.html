<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Greek Mythology 100 | 希腊神话百神图鉴</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-main">
        <div>
          <p class="eyebrow">Greek Mythology Atlas</p>
          <h1>希腊神话百神图鉴</h1>
        </div>
        <div class="header-stats" aria-label="目录统计">
          <span><strong id="totalCount">100</strong> 位神祇</span>
          <span><strong id="visibleCount">100</strong> 个结果</span>
        </div>
      </div>

      <div class="controls" aria-label="目录工具">
        <label class="control search-control">
          <span>搜索</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Zeus / 宙斯 / Ἀθηνᾶ / 雷霆" />
        </label>

        <label class="control">
          <span>排序</span>
          <select id="sortSelect">
            <option value="rank">知名度</option>
            <option value="name">英文名</option>
            <option value="group">类别</option>
          </select>
        </label>

        <label class="control voice-control">
          <span>英文语音</span>
          <select id="voiceSelect" aria-label="英文语音"></select>
        </label>

        <button class="icon-button" id="stopSpeech" type="button" aria-label="停止朗读" title="停止朗读">■</button>
      </div>
    </header>

    <main>
      <section class="lineage-overview" aria-labelledby="lineageTitle">
        <div class="lineage-copy">
          <p class="eyebrow">Genealogy Map</p>
          <h2 id="lineageTitle">神谱速读</h2>
          <p>这里只保留最常识、最应该先记住的主干关系；每位神更细的父母、配偶、子女和异说放在详情页里。</p>
        </div>
        <div class="lineage-lanes" aria-label="主干谱系">
          <div class="lineage-lane">
            <span>原初</span>
            <button type="button" data-detail="chaos">Chaos</button>
            <button type="button" data-detail="gaia">Gaia</button>
            <button type="button" data-detail="uranus">Uranus</button>
            <button type="button" data-detail="nyx">Nyx</button>
          </div>
          <div class="lineage-lane">
            <span>泰坦父母</span>
            <button type="button" data-detail="cronus">Cronus</button>
            <button type="button" data-detail="rhea">Rhea</button>
          </div>
          <div class="lineage-lane">
            <span>奥林匹斯兄妹</span>
            <button type="button" data-detail="zeus">Zeus</button>
            <button type="button" data-detail="hera">Hera</button>
            <button type="button" data-detail="poseidon">Poseidon</button>
            <button type="button" data-detail="hades">Hades</button>
            <button type="button" data-detail="demeter">Demeter</button>
            <button type="button" data-detail="hestia">Hestia</button>
          </div>
          <div class="lineage-lane">
            <span>宙斯子女</span>
            <button type="button" data-detail="athena">Athena</button>
            <button type="button" data-detail="apollo">Apollo</button>
            <button type="button" data-detail="artemis">Artemis</button>
            <button type="button" data-detail="persephone">Persephone</button>
            <button type="button" data-detail="calliope">Muses</button>
          </div>
        </div>
        <div class="lineage-sources">
          <span>谱系骨架参考</span>
          <a href="https://www.theoi.com/Tree.html" target="_blank" rel="noreferrer">Theoi family tree</a>
          <a href="https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0130%3Acard%3D104" target="_blank" rel="noreferrer">Hesiod Theogony</a>
        </div>
      </section>
      <section class="lineage-board" id="lineageBoard" aria-label="谱系主干板"></section>
      <nav class="filters" id="groupFilters" aria-label="神祇类别"></nav>
      <section class="catalog" id="catalog" aria-live="polite"></section>
    </main>

    <dialog class="detail-dialog" id="detailDialog">
      <article class="detail-panel" id="detailPanel"></article>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <footer class="site-footer">
      <span>原创中文简介；主图为生成式全身形象，经典艺术作品作为知识参考。</span>
      <a href="开发文档.md">开发文档</a>
    </footer>

    <script src="myth-data.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
